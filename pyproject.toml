[project]
name = "pdfabric"
authors = [
  {name = "Dhia Hmila"},
]
description = "PDF manipulation tools"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = []
readme = "README.md"
dynamic = ['version']
dependencies = [
  "click",
  "cryptography>=3.1",
  "pypdf",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/hmiladhia/pdfabric"
Issues = "https://github.com/hmiladhia/pdfabric/issues"

[project.scripts]
pdfabric = "pdfabric.cli:main"

[dependency-groups]
dev = [{ include-group = "tests" }, { include-group = "workspace" }]
workspace = ["pdfabric"]
tests = [
    "pytest>=8.3.4",
    "pytest-sugar",
    { include-group = "workspace" }
]
ci = ["coverage", { include-group = "tests" }]
linting = ["ruff==0.11.*", "mypy==0.16.*"]

# == Build and Environment Config ==
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdfabric/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/packages/",
    "/plugins/",
    "tests/",
    ".github/",
    "uv.lock",
    ".pre-commit-config.yaml",
    ".copier-answers.yml",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfabric"]

[tool.hatch.build.targets.wheel.sources]
"src/pdfabric" = "pdfabric"

[tool.commitizen]
tag_format = "v$version"
provider="py-dist"
update_changelog_on_bump = true
changelog_merge_prerelease = true
version_files = [
    "src/pdfabric/__init__.py:__version__",
]

# == Linting Rules ==
[tool.ruff]
target-version = "py39"


[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "E", # pycodestyle - Error
  "W", # pycodestyle - Warning
  "F", # Pyflakes
  "N", # pep8-naming
  "S", # flake8-bandit
  "RUF", # Ruff-specific rules
  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLW", # Pylint Warning
  "PLR", # Pylint Refactor
  "Q", # flake8-quotes
]


[tool.ruff.lint.per-file-ignores]

"**/tests/**.py" = ["S101"]
[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pycodestyle]
max-line-length = 100
ignore-overlong-task-comments = true

# == Tests config ==
[tool.coverage.run]
source = ["src"]
relative_files = true
branch = true

[tool.tox]
min_version = "4"
requires = ["tox>=4.31", "tox-uv>=1.29.0"]
env_list = ["format", "lint", "type", "3.14", "3.13", "3.12", "3.11", "3.10"]

# This is a workaround
# See Issue: https://github.com/ymyzk/tox-gh-actions/issues/198
[tool.tox.gh-actions]
python = """
	3.10: py310
	3.11: py311
	3.12: py312
	3.13: py313
  3.14: py314
	"""

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run unit tests"
dependency_groups = ["tests"]
commands = [["pytest", { replace = "posargs", default = ["."], extend = true }]]

[tool.tox.env.format]
description = "run formatter"
skip_install = true
dependency_groups = ["linting"]
commands = [["ruff", "format", { replace = "posargs", default = ["."], extend = true }]]

[tool.tox.env.lint]
description = "run linters"
skip_install = true
dependency_groups = ["linting"]
commands = [["ruff", "check", { replace = "posargs", default = ["."], extend = true }]]
